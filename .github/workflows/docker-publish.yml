name: Build and Push Docker Image
on: workflow_dispatch  # Changed from 'on: [push]' to manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Variables
        run: |
          # Define all variables locally first
          DATE_TAG=$(date +%Y-%m-%d)
          LATEST_TAG="latest"
          BRANCH_NAME="${{ github.ref_name }}"
          PROJECT_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)
          IMAGE_NAME="${{ vars.DOCKER_USERNAME }}/$PROJECT_NAME:$BRANCH_NAME"
          
          # Export them to GITHUB_ENV
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # Print env variables
      - name: Print Variables
        run: env
        
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}-${{ env.DATE_TAG }}
            ${{ env.IMAGE_NAME }}-${{ env.LATEST_TAG }}

      - name: Scan rsl-ui image
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.IMAGE_NAME }}-${{ env.DATE_TAG }}
          category: trivy-rsl-ui

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}-${{ env.DATE_TAG }}
          docker push ${{ env.IMAGE_NAME }}-${{ env.LATEST_TAG }}
